name: Full CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. CI Mərhələsi: Sintaksis və Build yoxlanışı
  ci-test:
    name: 1. CI - Code Check
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çəkmək
        uses: actions/checkout@v4

      - name: Go mühitini quraşdırmaq
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Asılılıqları yükləmək
        run: go mod download

      - name: Static kod analizi
        run: go vet ./...

      - name: Go build yoxlanışı
        run: go build -v ./...

  # 2. CD Mərhələsi: Docker Image Build və Docker Hub-a göndərilməsi
  cd-build-push:
    name: 2. CD - Docker Build & Push
    needs: ci-test
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çəkmək
        uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildx quraşdırmaq
        uses: docker/setup-buildx-action@v3

      - name: Docker image yığmaq və Push etmək
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/go-hello-world:latest

  # 3. CD Mərhələsi: Serverə SSH ilə bağlanıb avtomatik Yeniləmək (Full Deployment)
  cd-deploy:
    name: 3. CD - Deploy to Server
    needs: cd-build-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH ilə Serverdə Konteyneri Yeniləmək
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/go-hello-world:latest
            docker stop my-go-app || true
            docker rm my-go-app || true
            docker run -d --name my-go-app -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/go-hello-world:latest