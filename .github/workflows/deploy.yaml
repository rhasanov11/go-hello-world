name: Full Local CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  full-ci-cd:
    name: Test, Build and Deploy Locally
    runs-on: self-hosted
    steps:
      - name: Kodu GitHub-dan çəkmək
        uses: actions/checkout@v4

      - name: Go mühitini quraşdırmaq
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Asılılıqları yükləmək
        run: go mod download

      - name: Sintaksis yoxlanışı (CI)
        run: go vet ./...

      - name: Go Build yoxlanışı
        run: go build -v ./...

      - name: Docker Image Yığmaq və Konteyneri Yeniləmək (CD)
        run: |
          docker build -t go-hello-world:latest .
          docker stop my-go-app
          docker rm my-go-app
          docker run -d --name my-go-app -p 8080:8080 go-hello-world:latest